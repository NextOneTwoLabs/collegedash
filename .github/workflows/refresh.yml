name: Refresh program data

# Public-web collectors only (athletics sites, TopDrawerSoccer, SoccerWire, NCAA RPI, Scorecard).
# The social scout never runs here - it needs the logged-in browser profile on your own PC.
#
#   daily 11:00 UTC  -> commitments (TDS + SoccerWire), news, NCAA RPI
#   Mondays          -> also rosters/schedules (no bios) and Wikipedia; school facts and climate only
#                       on a manual "full" run (Scorecard falls back to DEMO_KEY, 30 requests/hour,
#                       until the SCORECARD_API_KEY secret is set)
# Pushing to main triggers the Cloudflare deploy.

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Run every collector (rosters, schedules, bios, school facts, climate, Wikipedia)"
        type: boolean
        default: false

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Refresh data
        id: refresh
        continue-on-error: true
        env:
          SCORECARD_API_KEY: ${{ secrets.SCORECARD_API_KEY }}
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python collegedash.py refresh --no-bios
          elif [ "$(date -u +%u)" = "1" ]; then
            python collegedash.py refresh --only athletics,wikipedia,tds,soccerwire,news,rpi --no-bios
          else
            python collegedash.py refresh --only tds,soccerwire,news,rpi
          fi

      - name: Show refresh state
        if: always()
        run: cat public/archive/refresh-state.json || echo "(no state file)"

      - name: Commit changed data
        if: always()
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No data changed; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Fail if the refresh reported errors
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "collegedash.py reported failures - see the Refresh data step."
          exit 1
