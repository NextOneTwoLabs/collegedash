name: Refresh program data

# Public-web collectors only (athletics sites, TopDrawerSoccer, SoccerWire, NCAA RPI, Scorecard).
# The social scout never runs here - it needs the logged-in browser profile on your own PC.
#
#   daily 11:00 UTC  -> commitments (TDS + SoccerWire), news, ID camps, NCAA RPI
#   Aug-Dec daily    -> also rosters/schedules (no bios), so results land the morning after a game
#                       (about 2,800 extra requests and +60-90 min per run; the runner has no HTTP cache).
#                       The head coach's stored bio year is kept, not fetched (issue #168)
#   Mondays          -> also rosters/schedules (no player bios, but each head coach's bio page: one request
#                       per program, --coach-bios, issue #168) and Wikipedia; school facts and climate only
#                       on a manual "full" run (Scorecard falls back to DEMO_KEY, 30 requests/hour, until the
#                       SCORECARD_API_KEY secret is set)
# ID camps daily (issue #284; about 1,600 requests on a discovering run, 1,400 on a stored-link one, at
# 942 programs). Each run fetches every program's camp page, plus robots.txt once per off-site camp host.
# How the camp LINK is found depends on the day:
#   Mondays and Aug-Dec -> rediscovered from the roster page. Aug-Dec that page comes from this run's cache,
#                          because athletics fetched the same URL a moment earlier, so it costs nothing
#   Jan-Jul, not Monday -> --camps-stored-link: the link the last run stored, no roster request and no hub
#                          hop (a 404/410 on it rediscovers at once)
# A camp host outside the athletics site that answers 403 or 429 is recorded in
# data/camps-refused-hosts.json and never requested again by camps. A 403 stays until a PR deletes the
# entry (between runs); a 429 gets one retry on the first Monday at least 7 days after it was recorded
# (--camps-retry-429), and is dropped if that retry answers 2xx (collect/camps.py has the rules).
#
# Manual dispatch, highest precedence first:
#   build_only=true  -> no collector at all; rebuild public/data from the stored
#                       programs/*/sources/*.json, validate, commit as "data: rebuild" (~1 min)
#   only="a,b"       -> run just those collectors (validated against collegedash.py's COLLECTORS
#                       plus rpi). Use it to republish one collector's data after a parser fix -
#                       e.g. only=camps is ~942 collector runs (one roster page plus the camp page
#                       it finds, per program) rather than the full run's thousands.
#   full=true        -> every collector, with head-coach bio pages but no player bio pages
#   otherwise the schedule branches above.
# Whatever the mode, the commit step rebuilds public/data from the stored sources after it rebases
# onto the current main and before it pushes, so a run always publishes data built by the code it is
# committing onto, never by the code it checked out hours earlier (issue #75). build and validate
# both gate that push: if the rebuild crashes or breaks an invariant, main is not touched at all -
# not the rebuilt profiles, and not that run's freshly collected rpi tables or registry.json either -
# so the live site keeps serving exactly what it served before. The run's whole collection is pushed
# to a per-run branch, where it can be inspected and reproduced, merged deliberately once the cause is
# known, and - the point of keeping it off main - cannot poison the next day's rebuild. There are two
# shapes, and the annotation on each says which it is, because they need different handling:
#   refresh-sources/<run id>-<run attempt>-<push attempt>   build or validate failed on the rebuilt data
#     (issue 82). The commit is rebased onto main and holds the collection, with public/data exactly as
#     main has it, and main's registry.json with this run's athletics.platform detections merged in.
#   refresh-sources/<run id>-<run attempt>-unpublished      nothing could be published at all (issue 117):
#     a rebase conflict this step does not resolve, a registry change a refresh must not make or a
#     registry merge that failed (issue 132), or three failed attempts. What that commit is - rebased
#     or not, rebuilt or not, gated or not - differs per cause, and the error on each says which.
# registry.json is merged, not taken from either side (issue 132): after every rebase,
# .github/scripts/merge_registry.py writes main's registry with only this run's athletics.platform changes
# re-applied, and only where main left that field alone. The rebase's `-X theirs` would otherwise let the
# run's copy silently revert a registry change merged into main while the run was collecting.
# Nothing deletes those branches: they are one commit each and are meant to be deleted by hand once the
# failure has been triaged.
# Pushing to main triggers the Cloudflare deploy.

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Run every collector (rosters, schedules, head-coach bios, school facts, climate, Wikipedia); player bios are not fetched"
        type: boolean
        default: false
      only:
        description: "Collectors to run, comma-separated (scorecard, climate, wikipedia, athletics, tds, soccerwire, news, camps, rpi). Empty = the scheduled set."
        type: string
        default: ""
      build_only:
        description: "Republish public/data from the stored programs/*/sources/*.json; run no collector at all (~1 min)"
        type: boolean
        default: false
      fail_threshold:
        description: "Share of collector runs allowed to fail before the run is marked failed (0.05 = 5%)"
        type: string
        default: "0.05"

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # issue #101: GitHub kills a job at 6 h, and a kill must not lose the run. The collector step stops starting
    # programs at 4.5 h (COLLEGEDASH_TIME_BUDGET_MINUTES below) and is killed at 5 h; the commit step is
    # `if: always()`, so it still runs, with about 50 minutes before this job limit.
    timeout-minutes: 350
    steps:
      # `only` is free text from the dispatch form, so it is never interpolated into a shell
      # command: it travels in `env` and is read as "$ONLY_INPUT". This step additionally checks it
      # against the collector list in collegedash.py (COLLECTORS, plus rpi) so a typo fails the run
      # in seconds rather than quietly collecting nothing. `collegedash.py refresh` re-validates
      # --only and exits 2 on an unknown name; this is the fast, pre-install guard.
      - name: Validate dispatch inputs
        if: inputs.only != ''
        env:
          ONLY_INPUT: ${{ inputs.only }}
        run: |
          known="scorecard climate wikipedia athletics tds soccerwire news camps rpi"
          bad=""
          set -f       # no pathname expansion: a '*' in the input is a token, not a glob
          IFS=','
          for raw in $ONLY_INPUT; do
            # trim the ends only, exactly as collegedash.py does (`c.strip()`), so the string
            # validated here is the string python is handed: `ca mps` stays bad
            name="${raw#"${raw%%[![:space:]]*}"}"
            name="${name%"${name##*[![:space:]]}"}"
            # every collector name is one lowercase word, so check the shape before the
            # membership test: `news camps` is a substring of $known but not a collector
            case "$name" in
              *[!a-z]*) bad="$bad '$name'" ;;
              *) case " $known " in
                   *" $name "*) ;;
                   *) bad="$bad '$name'" ;;
                 esac ;;
            esac
          done
          # field splitting discards a *trailing* empty field where python's split(',') keeps
          # it, so the commonest typo of all is caught here rather than in the loop above
          case "$ONLY_INPUT" in *,) bad="$bad ''" ;; esac
          unset IFS
          if [ -n "$bad" ]; then
            echo "::error title=refresh::unknown collector(s) in 'only':$bad (known: $known)"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # build_only (issue #40): republish public/data from the sources already in the repo. No
      # collector runs, no external requests, no refresh-state write (cmd_build never touches it) -
      # about a minute instead of two hours. Used to publish a build.py or curated.json change, or a
      # merged data PR. validate's own non-zero exit fails the run before anything is committed.
      - name: Rebuild data (build_only)
        if: inputs.build_only == true || inputs.build_only == 'true'
        run: |
          python collegedash.py build
          python collegedash.py validate

      # Individual collector failures are expected (a site is down, a page was redesigned); they are
      # reported as warnings. The run is marked failed only when more than the threshold share of
      # collector runs fail - a sign the flow itself needs attention - or when the command crashes.
      - name: Refresh data
        id: refresh
        if: inputs.build_only != true && inputs.build_only != 'true'
        continue-on-error: true
        timeout-minutes: 300
        env:
          SCORECARD_API_KEY: ${{ secrets.SCORECARD_API_KEY }}
          # issue #101 PR A: robots.txt is checked on every request and hop and COUNTED, nothing is blocked
          # (refresh-state.robots). Enforcing waits for the owner's bar (decision 5). Rollback: `off`.
          COLLEGEDASH_ROBOTS: report
          # start no new program after 4.5 h; the rest are skipped ('time budget') and keep their sources
          COLLEGEDASH_TIME_BUDGET_MINUTES: "270"
          COLLEGEDASH_FAIL_THRESHOLD: ${{ inputs.fail_threshold || '0.05' }}
          ONLY_INPUT: ${{ inputs.only }}
          FULL_INPUT: ${{ inputs.full }}
          # issue #168 step 1: name-free coach-bio diagnostics, written by the runs that fetch coach bios. Under
          # runner.temp, never in the checkout (the commit step runs `git add -A`); uploaded below, not committed.
          COACH_BIO_DIAG_DIR: ${{ runner.temp }}/coach-bio-diag
        run: |
          set +e
          if [ -n "$ONLY_INPUT" ]; then
            # a hand-picked collector list (validated above); --mode is only the label recorded
            # with the run summary, so `only` + `full` means "this list, logged as a full run".
            # No --coach-bios: an athletics re-run keeps each stored head-coach bio (issue #168)
            mode=manual
            if [ "$FULL_INPUT" = "true" ]; then mode=full; fi
            python collegedash.py refresh --only "$ONLY_INPUT" --no-bios --mode "$mode"
          elif [ "$FULL_INPUT" = "true" ]; then
            python collegedash.py refresh --no-bios --coach-bios --mode full
          elif [ "$(date -u +%u)" = "1" ]; then
            python collegedash.py refresh --only athletics,wikipedia,tds,soccerwire,news,camps,rpi --no-bios --coach-bios --camps-retry-429 --mode weekly
          elif [ "$(date -u +%m)" -ge 8 ]; then   # Aug-Dec, in season: schedules/results daily
            python collegedash.py refresh --only athletics,tds,soccerwire,news,camps,rpi --no-bios --mode daily
          else
            python collegedash.py refresh --only tds,soccerwire,news,camps,rpi --camps-stored-link --mode daily
          fi
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Show refresh state
        if: always()
        run: cat public/archive/refresh-state.json || echo "(no state file)"

      # Issue #168 step 1: the coach-bio diagnostics (per-program counts and masked patterns seen in 3 or more
      # programs) go to one short-lived artifact and nowhere else. Its own step, and it cannot fail the job or
      # block the publish below.
      - name: Upload coach-bio diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coach-bio-diag-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coach-bio-diag/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit changed data
        if: always()
        env:
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No data changed; nothing to commit."
            exit 0
          fi
          verb=refresh
          if [ "$BUILD_ONLY" = "true" ]; then verb=rebuild; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stamp=$(date -u +%Y-%m-%dT%H:%MZ)
          git add -A
          # issue #168 step 1: the coach-bio diagnostics live under runner.temp and are an artifact only; a
          # diagnostics file in this commit would publish it, so stop before committing anything.
          if git diff --cached --name-only | grep -q 'coach-bio-diag'; then
            echo "::error title=refresh::a coach-bio diagnostics file is staged for commit; it must stay under runner.temp (issue #168). Nothing was committed."
            exit 1
          fi
          git commit -m "data: $verb $stamp"
          # main may have moved while the collectors ran (a push from a developer machine, or a PR
          # merged mid-run), which makes a plain push non-fast-forward. Rebase onto upstream first;
          # on a data-file conflict the freshly collected version wins (-X theirs = this commit
          # during a rebase). Retry a few times in case another push lands in between.
          #
          # Issue #75: the rebase brings in newly merged *code* but rebuilds nothing, so without the
          # rebuild below the commit publishes public/data built by the code checked out up to two
          # hours ago - and -X theirs makes that stale data overwrite what the merged PR published.
          # So rebuild from the stored sources after every rebase and before every push, and amend
          # the data commit with the result. The rebuild is inside the loop on purpose: a rejected
          # push means a second rebase onto a different main, which needs a second rebuild.
          # It runs unconditionally, build_only included - a build_only run races the same way, just
          # over one minute instead of two hours - so that every run exercises this path rather than
          # only the rare one where it matters. Measured at 5.3s for all 350 profiles on the runner.
          #
          # Both gates below refuse to publish data. Neither should throw the run's collection away
          # with it: the sources are the expensive half (two hours of HTTP) and on a build crash they
          # are also the only evidence of what broke. But the collection must not go to *main*
          # either. A source that fails a gate fails it again on every later run, and only the daily
          # collectors (tds, soccerwire, news, rpi) re-collect the program the next morning and
          # overwrite it. camps and wikipedia run on Mondays, so a bad one of those left on main
          # wedges every rebuild until the following Monday - six days of frozen program data and
          # seven red runs; scorecard and climate have no scheduled run at all, so the wedge is
          # unbounded. Two defects that do exactly this are reachable today from one field of one
          # stored camps source (price: 250 fails validate; startDate: 20260601 crashes build.py:459).
          #
          # So the whole commit goes to a per-run branch instead, and main is left exactly as the
          # rebase found it. The collection survives, is reproducible by checking the branch out, and
          # is merged by a human who knows which of the two causes it was; the daily runs keep
          # publishing in the meantime. One branch per run attempt *and* per push attempt, because
          # GITHUB_RUN_ID is stable across a "Re-run all jobs" and a stale ref would then reject the
          # push - losing the collection in the one place it must not be lost. The first two components
          # are digits and the third is a digit here or the literal "unpublished" in save_collection, so
          # the ref name is always valid, and the two shapes can never collide with each other.
          #
          # public/data is still restored before the commit, so that what lands on the branch is a
          # clean "sources ahead of data" snapshot rather than a half-written build. Only what
          # build() writes is restored: public/data/programs/**, commitments/index.json,
          # camps/index.json. public/data/rpi/** and registry.json look derived but are *collected* -
          # collect/rpi.py writes current.json and the weekly snapshots, and the site fetches
          # rpi/current.json directly - so restoring all of public/data would discard part of the
          # very collection this exists to save, and would leave a later build_only joining fresh
          # program sources onto a stale RPI table: issue 75's own shape, one level down.
          # rm -rf first because `git checkout <rev> -- <path>` restores what <rev> has and never
          # deletes the extras, and a crashed build can leave a profile upstream has no file for.
          #
          # The assertion after the restore is the load-bearing guard, not the `if ! git checkout`
          # above it: it is what catches a restore that failed *and* a restore that silently did
          # nothing, and it is stated as "public/data, except the collected parts" rather than as the
          # list just restored, so a fifth build() output added later is a hard stop here instead of
          # a silent publish. The exclusions are the machine-checked version of the paragraph above.
          #
          # `bash -e` is suspended for the whole dynamic extent of a function invoked as an `if`
          # condition, so nothing in here fails the step by itself and every command that must not be
          # skipped is checked. The amend is the one to understand: the rebuild is never committed,
          # so an unguarded failure leaves HEAD holding the *pre-rebase* tree - issue 75 itself,
          # built by the code checked out hours ago - and pushes it under the subject
          # "data: refresh <stamp>" while the annotation describes a sources-only snapshot. Measured.
          # That lands on the branch, not on main, so it is a mislabelled branch rather than the
          # silent inversion it would be if this pushed to main; it is still worth the guard.
          #
          # Returns 0 when the collection is safe on its branch (the caller then fails the run) and 1
          # when the push was rejected and the caller should retry. Every other failure annotates and
          # exits from in here, because the retry loop cannot recover from a dirty index - git pull
          # --rebase refuses outright - and would otherwise spend 30s printing "retrying" at an
          # operator who is owed a diagnosis instead.
          publish_sources_only() {
            branch="refresh-sources/${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}-$2"
            rm -rf public/data/programs
            # data/clubs-review.json and data/schools-review.json are restored separately and
            # tolerantly, one at a time: they are the two build() outputs outside public/data
            # (issues #228, #229), and a `git checkout` naming a path the upstream commit does not
            # carry fails outright, taking the whole restore with it. Upstream may legitimately not
            # have one - before the first build that writes it - and then the right restore is to
            # delete the copy this run produced.
            for report in data/clubs-review.json data/schools-review.json; do
              git checkout FETCH_HEAD -- "$report" 2>/dev/null || rm -f "$report"
            done
            # The clubs & schools index (issue #230) is restored the same tolerant way, for the same
            # reason: upstream has none until the first refresh after that build lands.
            git checkout FETCH_HEAD -- public/data/trends/index.json 2>/dev/null || rm -f public/data/trends/index.json
            if ! git checkout FETCH_HEAD -- public/data/programs public/data/commitments/index.json public/data/camps/index.json; then
              echo "::error title=refresh::$1 on the rebuild onto $onto, and public/data could not then be restored to what $onto holds. Nothing was pushed anywhere: main is still $onto and the live site is unchanged - but this run's collection was NOT saved either, it exists only on this runner. Re-dispatch this workflow to collect again."
              exit 1
            fi
            git add -A
            if ! git diff --quiet FETCH_HEAD -- public/data data/clubs-review.json data/schools-review.json ':(exclude)public/data/rpi' ':(exclude)public/data/registry.json'; then
              echo "::error title=refresh::$1 on the rebuild onto $onto, and public/data does not match $onto after the restore - either the restore did nothing, or build() now writes something outside public/data/programs, commitments/index.json, camps/index.json, trends/index.json, data/clubs-review.json and data/schools-review.json and that path was never restored. Nothing was pushed anywhere: main is still $onto and the live site is unchanged, and this run's collection was NOT saved."
              exit 1
            fi
            if git diff --quiet FETCH_HEAD --; then
              echo "::error title=refresh::$1 on the data rebuilt onto $onto. Nothing was published: main is still $onto and the live site is unchanged. This run collected nothing of its own - build_only does not - so there is nothing to preserve and no sources branch was created. Fix the cause on main and dispatch build_only=true again."
              exit 1
            fi
            if ! git commit --amend -m "data: sources only $stamp" \
              -m "$1 on the rebuild onto $onto. Nothing here was published to main, which is still $onto. This commit holds the run's collected programs/*/sources and public/data/rpi, and registry.json as merged onto $onto (main's, with this run's athletics.platform detections re-applied: issue 132); everything build() writes is exactly as $onto has it, so checking this branch out and running build then validate reproduces the failure. Merge it only once you know the cause was bad code and not a bad source (issue 75)."; then
              echo "::error title=refresh::$1 on the rebuild onto $onto, and the sources-only commit could not be created. Nothing was pushed anywhere: main is still $onto and the live site is unchanged, and this run's collection was NOT saved."
              exit 1
            fi
            if ! git push origin "HEAD:refs/heads/$branch"; then
              echo "::warning title=refresh::$1 on the rebuild onto $onto, and pushing the collection to $branch was rejected. Retrying."
              return 1
            fi
            echo "::error title=refresh::$1 on the data rebuilt onto $onto. NOTHING WAS PUBLISHED: main is still $onto and the live site is unchanged - not the rebuilt profiles, and not this run's freshly collected RPI tables or registry.json. The run's entire collection is on branch $branch instead: one commit on top of $onto holding programs/*/sources, public/data/rpi and registry.json (main's registry with this run's athletics.platform detections merged in, never the run's raw copy: issue 132), with everything build() writes (public/data/programs, commitments/index.json, camps/index.json) left exactly as $onto has it. Nothing is lost, and the failure reproduces with: git fetch origin $branch && git checkout FETCH_HEAD && python collegedash.py build && python collegedash.py validate. RECOVERY DEPENDS ON THE CAUSE, so find it first. Code merged into main mid-run: fix main, merge $branch, then dispatch this workflow with build_only=true to publish from the saved sources in about a minute. A source that came back malformed: re-dispatch this workflow instead - only=<collector> is enough - so the source is collected again, and fix the collector first if the site changed for good; build_only cannot recover that case, it would rebuild from the same bad file. Do not merge $branch before you know which it was: it carries the bad source too, and on main that bad source fails every later run until a human removes it."
            return 0
          }
          # Issue #117: -X theirs settles content conflicts but not modify/delete. Every rebuild rewrites
          # every profile (_build.builtAt changes), so a PR merged mid-run that deletes a profile - which
          # every membership change now does - stops the rebase with "CONFLICT (modify/delete)". Before
          # this, all three attempts then failed the same way and the run ended with its collection only
          # on the runner.
          #
          # A conflict confined to build() output under public/data/programs is resolved by removing the
          # file. That is safe because those files are build() output and nothing more: the rebuild that
          # follows every rebase writes a profile for every published program and prunes the rest (issue
          # 110), and the gates below still decide whether any of it is published.
          #
          # Removing the file here is "let the rebuild decide", not "the deletion stands": a program main
          # deleted comes back if the registry the rebuild reads still publishes it, so the annotations say
          # that rather than claiming the deletion was kept. Which registry the rebuild reads is settled
          # after the rebase by the registry merge (issue 132, below): main's membership always stands, so
          # this run's copy of the registry can no longer republish a program main removed.
          # Any other conflict - a collected source, registry.json itself, code - is not this step's to settle.
          rebase_stopped() {
            [ -d "$(git rev-parse --git-path rebase-merge)" ] || [ -d "$(git rev-parse --git-path rebase-apply)" ]
          }
          # Returns 0 once the rebase has completed. Returns non-zero, leaving the rebase stopped, when
          # there is no stopped rebase, when any conflict is outside public/data/programs/<slug>.json, or
          # when resolving fails. Called only as a condition, so errexit is off in here and each step is checked.
          resolve_profile_conflicts() {
            local f
            rebase_stopped || return 1
            conflicted=$(git diff --name-only --diff-filter=U)
            [ -n "$conflicted" ] || return 1
            if printf '%s\n' "$conflicted" | grep -qvE '^public/data/programs/[a-z0-9][a-z0-9-]*\.json$'; then
              return 1
            fi
            for f in $conflicted; do
              git rm -q -- "$f" || return 1
            done
            resolved="$conflicted"
            echo "::notice title=refresh::main changed or deleted $(printf '%s\n' "$conflicted" | wc -l) file(s) under public/data/programs that this run had rewritten. They are removed so the rebuild decides from the registry it reads whether each one comes back: $(echo $conflicted)"
            if ! GIT_EDITOR=true git rebase --continue; then
              continue_failed="$conflicted"
              return 1
            fi
          }
          # Never drop a collection (issue 117). When the step cannot publish and has no gate path for the
          # reason, push the run's commit as it stands to a per-run branch and fail the run.
          #
          # $2 says what that commit actually is, because the callers leave it in three different states and
          # an operator reading this at 03:00 acts on it:
          #   unrebased  the run as it stood, never rebased onto the current main and never gated.
          #   rebased    rebased, rebuilt and past both gates; only the push to main failed.
          #   registry   the registry merge after the rebase failed (issue 132): the run changed something in
          #              registry.json a refresh must not, a copy did not parse, or the merge script is
          #              missing or crashed. The commit pushed is $3, the run's own commit from before any
          #              rebase, so its registry.json is exactly as the run wrote it - the unexpected change
          #              is kept for a human to inspect - and it is NOT rebased, rebuilt or gated. It must not
          #              be merged as it stands: that registry predates main's, and taking it would revert
          #              every registry change merged since, which is the publish this step refused.
          # $3, when given, is the commit to push instead of HEAD.
          # Telling someone to redo work that is already done, or to redo work the step deliberately refused,
          # is how a good annotation becomes a bad night; the three say different things.
          save_collection() {
            local pushed rev short
            rev=${3:-HEAD}
            git rebase --abort 2>/dev/null || true
            branch="refresh-sources/${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}-unpublished"
            base=$(git rev-parse --short "$rev~1" 2>/dev/null || echo "an unknown commit")
            short=$(git rev-parse --short "$rev" 2>/dev/null || echo "$rev")
            if [ "$2" = "registry" ]; then
              pushed="MAIN'S REGISTRY STANDS and the live site is unchanged; this run published nothing, on purpose. Its collection is safe on branch $branch: one commit ($short) on $base exactly as the run made it - NOT rebased onto the current main and NOT checked by build or validate - and its public/data/registry.json is this run's copy as the run wrote it, kept so the change can be inspected. Do NOT merge $branch or push it as it stands: that registry predates main's, and taking it would revert every registry change merged into main since $base. To recover: git fetch origin $branch && git checkout FETCH_HEAD, and see what the run changed with git diff $base FETCH_HEAD -- public/data/registry.json. Rebase it onto origin/main taking main's registry (git checkout origin/main -- public/data/registry.json while resolving). If the run changed only athletics.platform values (the merge script failed rather than refused), re-apply them with python .github/scripts/merge_registry.py --base $base --main origin/main --run $short; anything else is a bug in whatever wrote it, so leave it out and fix that. Then run python collegedash.py build and python collegedash.py validate, and push. Nothing needs collecting again."
            elif [ "$2" = "rebased" ]; then
              pushed="Its collection is safe on branch $branch: the run's commit on $base, rebased onto main, rebuilt from the stored sources and past both build and validate - everything except the push to main succeeded. To publish it: git fetch origin $branch, check it out, rebase it onto main (there is no conflict to resolve unless main has moved again), and push. Nothing needs collecting again."
            else
              pushed="Its collection is safe on branch $branch: one commit on $base exactly as the run made it - NOT rebased onto the current main and NOT checked by build or validate, so do not merge it as it stands. To publish it: check the branch out, rebase it onto main resolving the conflict by hand and taking main's public/data/registry.json (git checkout origin/main -- public/data/registry.json), then re-apply only this run's athletics.platform changes with python .github/scripts/merge_registry.py --base $base --main origin/main --run $short (issue 132), run python collegedash.py build and validate, and push. Or re-dispatch this workflow to collect again."
            fi
            if git push origin "$rev:refs/heads/$branch"; then
              echo "::error title=refresh::$1. NOTHING WAS PUBLISHED: this run did not update main. $pushed"
            else
              echo "::error title=refresh::$1, and pushing the collection to $branch was rejected too. NOTHING WAS PUBLISHED and this run's collection was NOT saved: it exists only on this runner. Re-dispatch this workflow to collect again."
            fi
            exit 1
          }
          # The run's own commit, captured ONCE, before any rebase, and never again inside the loop: the
          # registry merge below needs the registry exactly as the run wrote it. An attempt that rebased and
          # amended, then lost the push race, leaves HEAD holding a registry already merged onto an older main;
          # re-capturing it would treat that main's edits as the run's own (issue 132, plan review condition 2).
          pre_rebase=$(git rev-parse HEAD)
          # Set only once an attempt has rebased, rebuilt and passed both gates, i.e. HEAD is what the final
          # save_collection may call "rebased". Three attempts can also end with no rebase at all (every
          # git pull failing on the network), and that commit is the run's own, unrebased (issue 132).
          gated=
          for attempt in 1 2 3; do
            resolved=
            continue_failed=
            if git pull --rebase -X theirs origin main || resolve_profile_conflicts; then
              # A rebase drops a commit that came out empty, leaving HEAD at upstream's tip - and the
              # amend below would then be amending someone else's commit. This is reachable, in two
              # ways: the collector pass can crash before its own build, so public/data is untouched
              # and _build.builtAt is not refreshed, and a human pushing an identical source edit
              # meanwhile makes the replayed commit empty; or a push lands but its acknowledgement is
              # lost, and the next attempt finds its own commit already upstream.
              # The remote is not at risk either way - there is no --force here, so git would reject
              # the push as non-fast-forward and the next attempt would rebase the amended commit
              # into an ordinary one on top. What the guard actually saves is that wasted cycle and a
              # spurious duplicate data commit, which is worth three lines on its own.
              # FETCH_HEAD rather than origin/main: it is written by the pull itself, whatever
              # refspec checkout configured.
              if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
                echo "The rebase dropped the data commit as empty; main already holds this data."
                exit 0
              fi
              onto=$(git rev-parse --short FETCH_HEAD)
              gated=
              # Issue #132: the registry is merged, not taken from the rebase. `-X theirs` kept the RUN's copy of
              # any registry hunk both sides changed, which silently reverted a registry edit merged into main
              # mid-run (a membership move, a hold) whenever this run's athletics.platform detection sat next to
              # it. merge_registry.py writes main's registry with only this run's athletics.platform changes
              # re-applied, where main left that field alone and the program is still in main's `programs`; a
              # run that did not touch the registry gets main's bytes exactly. Any other change this run made to
              # the registry is not a refresh's to make, and fails closed. Everything after this - the rebuild,
              # both gates, publish_sources_only's branch - reads or carries the merged registry.
              # Called as an `if` condition and failing closed through save_collection, never through errexit:
              # a missing or crashing script must still leave the collection on a branch (plan review
              # condition 1). save_collection pushes $pre_rebase, the run's commit with its registry exactly
              # as written, so the change that was refused can be inspected (condition 3).
              if ! merge_base=$(git merge-base "$pre_rebase" FETCH_HEAD) \
                 || ! python .github/scripts/merge_registry.py --base "$merge_base" --main FETCH_HEAD --run "$pre_rebase"; then
                save_collection "The registry merge after the rebase onto $onto failed (see the registry merge annotation above): this run changed public/data/registry.json in a way a refresh must not, a copy of it could not be read, or .github/scripts/merge_registry.py is missing or crashed" "registry" "$pre_rebase"
              fi
              # Deliberate behaviour change (see the PR for #75): build and validate both gate the
              # data publish now, on every path rather than only build_only. The rebuild is what
              # first runs merged-mid-run code against the full corpus, so publishing its output
              # unchecked would swap one silent corruption for another. `build` raising is a
              # documented event here (README, "Refresh runs and failures": rpi: no season table
              # resolved), which is exactly why a gate failure keeps the run's collection on a
              # branch rather than discarding it.
              #
              # The two review reports go back to main's published copy first (issue #235). build() reads
              # each one as the "previous" report to mark names new since the last build; without this it
              # read the copy this run's own first build wrote (refresh, or the build_only step), so every
              # refresh reported 0 new. Tolerant, as in publish_sources_only: main may have no copy yet,
              # and then the build writes a first report.
              for report in data/clubs-review.json data/schools-review.json; do
                git checkout FETCH_HEAD -- "$report" 2>/dev/null || rm -f "$report"
              done
              if ! python collegedash.py build; then
                if publish_sources_only "build failed" "$attempt"; then exit 1; fi
              elif ! python collegedash.py validate; then
                if publish_sources_only "validate failed" "$attempt"; then exit 1; fi
              else
                git add -A
                # Which of the removed files the rebuild put back, if any - staged, because a recreated file is
                # untracked until `git add` and `git diff` would not see it. Not a failure: the registry the
                # rebuild read still publishes those programs, and the registry merge above has already made
                # that registry main's, never the run's copy over main's (issue 132; it replaced the PR #124
                # guard that refused this case). It is here because "main deleted it and it is back" is
                # exactly the thing an operator should not have to infer from a green run.
                added=" $(git diff --cached --name-only --diff-filter=A FETCH_HEAD -- public/data/programs | tr '\n' ' ')"
                back=
                for f in $resolved; do
                  # only a file this step removed can have "come back"; a profile for a program main onboarded
                  # is also new to main and is not that (PR #124 second review, R1)
                  case "$added" in *" $f "*) back="$back $f" ;; esac
                done
                back=${back# }
                if [ -n "$back" ]; then
                  echo "::warning title=refresh::the rebuild put back $back, which main deleted: the registry it was built from still publishes those programs. If main meant to drop them, the registry change is missing."
                fi
                # --amend, not a second commit: one run stays one commit, and a retry re-amends the
                # same commit instead of stacking one per attempt. The body records what it was built
                # onto, which is the only thing a second commit would have made more visible. No "#"
                # on the issue number: GitHub would cross-reference issue 75 from every daily commit.
                # No `|| ...` on this amend, unlike the ones in the function above: errexit applies
                # normally in this `else` *body*, so a failed amend aborts the step before the push.
                # Do not "fix the inconsistency" in either direction - both shapes fail closed only
                # where they are.
                git commit --amend -m "data: $verb $stamp" \
                  -m "Rebuilt from the stored sources onto $onto after rebasing, so the published data is the output of the code it is committed onto (issue 75)."
                gated=1
                if git push; then
                  exit 0
                fi
              fi
            elif rebase_stopped; then
              # After a successful resolve that could not be continued there are no unmerged paths left to
              # list, so fall back to what was resolved, and never emit an empty list (issue 124 review).
              unresolved=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
              if [ -n "$unresolved" ]; then
                save_collection "The rebase onto main stopped on a conflict this step does not resolve: $unresolved" "unrebased"
              else
                save_collection "The rebase onto main could not continue after resolving ${continue_failed:-its conflicts} (git reported no unmerged path; see the log above for what it said)" "unrebased"
              fi
            fi
            echo "attempt $attempt did not publish; retrying in 15s"
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          # save_collection always exits. Without a gated commit, what is saved is the run's own commit as it
          # was before any rebase, which is exactly what the "unrebased" text describes.
          if [ -n "$gated" ]; then
            save_collection "Could not publish after 3 attempts (see the attempts above for why)" "rebased"
          fi
          save_collection "Could not publish after 3 attempts, and none of them got as far as a rebased, rebuilt and gated commit (see the attempts above for why)" "unrebased" "$pre_rebase"

      - name: Fail if too many collectors failed
        if: steps.refresh.outputs.code != '' && steps.refresh.outputs.code != '0'
        env:
          REFRESH_CODE: ${{ steps.refresh.outputs.code }}
          FAIL_THRESHOLD: ${{ inputs.fail_threshold || '0.05' }}
        run: |
          echo "refresh exited with code $REFRESH_CODE: 1 = more than $FAIL_THRESHOLD of collector runs failed, 2 = the command crashed."
          echo "See the Summary tab for the failure table. The data that was collected has already been committed."
          exit 1
