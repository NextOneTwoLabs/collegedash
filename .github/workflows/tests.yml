name: Tests

# Every check suite in the repository, on every pull request, every push to main, and every
# completed run of "Refresh program data" (issue #63, issue #154).
#
# Before this existed, `.github/workflows/refresh.yml` was the only workflow and it never ran a
# test file: 801 checks ran only when a person remembered to run them. The cost of that is not
# hypothetical - a privacy check written to stop real email addresses reaching a public repository
# scored 380 of 380 with three real addresses in front of it, and nothing would have caught it on
# merge.
#
# No step here names the test files it runs. The Python suites under tests/ and the Node suites are
# each discovered by a glob, because a workflow that lists its suites is green the day someone adds
# one it does not list - which is the failure #63 exists to end, and which happened to both halves
# of this file before they were changed. What each discovery step guards instead is three
# assertions computed from the tree at run time; the scripts in .github/scripts/ carry the detail.
#
# One red suite never hides the state of the others: the steps run after an earlier failure
# (`if: ${{ !cancelled() }}`), and inside the discovery steps every suite runs and is judged
# separately. The run's Summary tab carries a table of every suite with its check count and time.
#
# Every suite is offline: no network, no token, no HTTP cache, and the ones that build do so into a
# temporary directory rather than touching public/data. Nothing here writes to the repository.
#
# Why this workflow also listens for workflow_run (issue #154)
# ---------------------------------------------------------------
# refresh.yml commits and pushes to main with the default GITHUB_TOKEN, and GitHub does not start
# workflows - this one included - from a push made with GITHUB_TOKEN, to stop a workflow from
# retriggering itself indefinitely. `push: branches: [main]` alone therefore never runs this
# workflow against a refresh commit: it only fires for a push carrying a person's own token or
# GitHub App credentials, such as the merge commit a pull request produces. That is not
# hypothetical - the runs on main stopped dead at the last such merge, and the two refresh commits
# that followed it (03c33317, 32afd35c) had no tests run at all, which is exactly how #153, a real
# regression in the refreshed data, reached main showing green.
#
# `workflow_run` on "Refresh program data" `completed` is triggered by that workflow's completion
# rather than by its commit's push event, so it is exempt from the GITHUB_TOKEN restriction above
# and fires every time, success or failure - refresh.yml can still have published data even when
# its own run is later marked failed, by the collector-failure-rate check that runs after the
# commit step. The alternative the issue named, running the suites as a step inside refresh.yml
# itself, was rejected: it would couple two workflows #63 deliberately kept separate (one runs
# every check suite by discovery; the other collects and publishes data), and it would add this
# job's time to every refresh run rather than running once, after the fact, against the commit
# that matters.
#
# workflow_run's own head_sha is the commit refresh.yml STARTED from, before its own commit and
# push, so checking that out would test main as it stood before the refresh - silently missing the
# exact case this exists to catch. The checkout step below checks out the `main` branch by name
# instead, for a workflow_run trigger: by the time GitHub delivers a workflow_run event, the
# upstream run - its push included - has already finished, so `main` by name is the refreshed
# commit.
#
# What is deliberately NOT run here, and why it is not an oversight
# -----------------------------------------------------------------
# `tools/roster_check.py` and `tools/camps_check.py`'s discovery sweep both read roster pages from
# a local HTTP cache (.cache/http) that a fresh checkout - i.e. every CI runner - does not have.
# Absent the cache they skip every program and still exit 0: roster_check.py prints
# `summary: not-cached 350 (of 350)` and succeeds. That is issue #81. Wiring either in as it stands
# would paint a green tick over zero coverage, which is worse than not running them, because it
# turns an absence of testing into a positive signal. `camps_check.py --fixtures` is a different
# mode and is genuinely cacheless - 390 real checks against tests/fixtures/camps - so that is the
# one that runs. When #81 makes "checked nothing" a non-zero outcome in the tools themselves, the
# sweep can be added here with a --min-ok floor.
#
# Discovery is what keeps that exclusion honest rather than accidental: it is rooted at `tests/` and
# cannot reach `tools/`, and run_python_suites.py asserts that of every path it matches instead of
# leaving it to be read off the glob. So the two sweeps are absent by construction, and the one
# tools/ command that does run is written out by hand, where a reader can see the choice.
#
# The floors here are the other half of the same argument: see .github/scripts/run_suite.py.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh program data"]
    types: [completed]
    branches: [main]

# A pull request that gets a second push does not need the first run finished. A push to main from
# a person (a merge) is never cancelled, and neither is a workflow_run from refresh.yml: both are
# the result the run exists to check, not intermediate work someone is still typing. The daily
# refresh's OWN push never reaches this group via `push` at all - see the note near the top of this
# file on why `workflow_run` exists to cover that case instead.
concurrency:
  group: tests-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  suites:
    name: Check suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # workflow_run's own head_sha predates the refresh commit (see the note at the top of this
      # file); `main` by name is what actually carries it once the event is delivered. github.sha
      # for every other event reproduces exactly what an unset `ref` would check out here - the
      # ref/SHA that triggered the run - stated explicitly rather than left to checkout's default.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      # 3.12 matches refresh.yml, so a suite cannot pass here and fail in the workflow that
      # publishes data.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-registry.txt

      # 24, not the runner default: tests/feedback.test.mjs imports ../worker.js, which is ESM in a
      # .js file with no package.json declaring "type": "module". Node resolves that only through
      # module-syntax detection, unflagged since 22.7. Pinning 24 keeps it off the edge of that.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        # requirements-registry.txt is the registry builder's timezone lookup: tests/registry_membership_test.py
        # needs it, the data refresh does not install it (PR #112 review, F6).
        run: pip install -r requirements.txt -r requirements-registry.txt

      - name: Start the suite table
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Check suites"
            echo
            echo "| suite | result | checks | time |"
            echo "| --- | --- | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Every Python suite, discovered rather than named. These used to be four steps, one per
      # file - which meant a fifth suite would not have run and this workflow would have been green
      # while skipping it. That was not hypothetical: PR #96 adds tests/sidearm_schedule_test.py,
      # and against a workflow naming four files it would have merged, never run, and reported
      # green. Naming the suites is the failure #63 exists to end, surviving inside the mechanism
      # built to end it; the Node step below was changed for the same reason a few hours earlier.
      #
      # Per-suite reporting is kept, not traded away: every discovered suite gets its own banner in
      # this step's log, its own error annotation naming it, and its own row in the Summary table,
      # and a failing suite does not stop the ones after it. Actions cannot generate steps from a
      # glob; the script's docstring records why a matrix job was rejected rather than used.
      #
      # --min-checks is an aggregate backstop against checks eroding inside an existing file, and
      # is NOT what catches a missing suite. That is three assertions computed from the tree: the
      # glob must match something, every suite-shaped file under tests/ must be matched by it, and
      # every discovered suite must report checks of its own. None of the three needs editing when
      # a suite is added, which is the point - and none assumes a number of suites, so this is
      # correct whether #96 merges before or after it.
      - name: python suites (every tests/*_test.py, discovered)
        if: ${{ !cancelled() }}
        run: python .github/scripts/run_python_suites.py --min-checks 396

      # Named, not discovered, and the one Python step that is meant to be. --fixtures is a mode
      # rather than a file: the default sweep needs an HTTP cache this runner does not have and
      # would exit 0 having checked nothing. Discovery above is rooted at tests/ and never reaches
      # tools/, which is what keeps that sweep - and tools/roster_check.py - out of this job by
      # construction rather than by omission. See the note at the top of this file and issue #81.
      - name: camps fixtures (tools/camps_check.py --fixtures)
        if: ${{ !cancelled() }}
        run: python .github/scripts/run_suite.py --name camps-fixtures --min-checks 390 -- python tools/camps_check.py --fixtures

      # Every Node suite, discovered rather than named. This step used to name
      # tests/feedback.test.mjs, which meant a second Node suite would not have run and this
      # workflow would have been green while skipping it - the failure #63 exists to end. The
      # discovery glob and the guards that go with it live in the script, which is also why this
      # step carries no list of files to keep in step with the repository.
      #
      # --min-checks here is only an aggregate backstop against tests disappearing from inside an
      # existing file. Unlike the floors above it is NOT what catches a missing suite: the script
      # requires every discovered file to have reported tests, and requires every file under tests/
      # that imports node:test to be discoverable in the first place. Neither needs raising when a
      # suite is added, which is the point.
      - name: node suites (every tests/*.test.mjs, discovered)
        if: ${{ !cancelled() }}
        run: python .github/scripts/run_node_suites.py --min-checks 15
