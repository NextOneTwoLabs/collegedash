# Cloudflare Workers config for the site.
#
# The site is the static files in public/ - the same directory `python collegedash.py serve`
# serves locally, so the deployed site is byte-identical to a local run (minus the feedback form,
# which needs the Worker). worker.js redirects the workers.dev address to the canonical custom
# domain and answers GET /api/status and POST /api/feedback. It runs ahead of the assets for "/"
# and "/api/*" only, so every other file is served as a free static asset without invoking the
# Worker.
#
# Canonical address: https://college.nextonetwo.com  (custom domain, attached to this Worker in
# the Cloudflare dashboard under Settings -> Domains & Routes).

name = "collegedash"
main = "worker.js"
compatibility_date = "2026-08-31"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/api/*"]

# Visitor feedback is stored in a FEEDBACK KV namespace, one key per submission. There is no
# binding here yet, and a placeholder id would not stand in for one: wrangler checks only that an
# id is a non-empty string and then sends it verbatim, so Cloudflare rejects an unknown namespace
# when the version is created - the build fails, nothing new publishes, and the site freezes on the
# last good version. Create the namespace with `npx wrangler kv namespace create FEEDBACK`, then
# add a [[kv_namespaces]] table here with binding = "FEEDBACK" and the id it prints. Until then
# worker.js answers POST /api/feedback with a 503 and the rest of the site deploys normally.
