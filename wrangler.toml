# Cloudflare Workers config for the site.
#
# The site is the static files in public/ - the same directory `python collegedash.py serve`
# serves locally, so the deployed site is byte-identical to a local run (minus the feedback form,
# which needs the Worker). worker.js redirects the workers.dev address to the canonical custom
# domain and answers GET /api/status and POST /api/feedback. It runs ahead of the assets for "/"
# and "/api/*" only, so every other file is served as a free static asset without invoking the
# Worker.
#
# Canonical address: https://college.nextonetwo.com  (custom domain, attached to this Worker in
# the Cloudflare dashboard under Settings -> Domains & Routes).

name = "collegedash"
main = "worker.js"
compatibility_date = "2026-08-31"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/api/*"]

# Visitor feedback is stored one key per submission in the KV namespace titled
# COLLEGEDASH_FEEDBACK on the NextOneTwoLabs account. The title is prefixed because the bare
# FEEDBACK title already belongs to the sibling project NextOneTwoLabs/nextonetwo-website; the
# title and the binding name are independent, and it is the binding name below that worker.js
# reads as env.FEEDBACK. The id is an identifier, not a credential, so committing it is correct.

[[kv_namespaces]]
binding = "FEEDBACK"
id = "effbba53953e424aa9f528b2a6f00f4e"
