# Cloudflare Workers config for the site.
#
# The site is the static files in public/ - the same directory `python collegedash.py serve`
# serves locally, so the deployed site is byte-identical to a local run (minus the feedback form,
# which needs the Worker). worker.js redirects the workers.dev address to the canonical custom
# domain, answers GET /api/status and POST /api/feedback, and refuses everything under /data/rpi
# with a 404 (issue #100; serve.py still serves those files locally). It runs ahead of the assets
# for "/", "/api/*" and "/data/rpi/*" only, so every other file is served as a free static asset
# without invoking the Worker.
#
# Canonical address: https://college.nextonetwo.com  (custom domain, attached to this Worker in
# the Cloudflare dashboard under Settings -> Domains & Routes).

name = "collegedash"
main = "worker.js"
compatibility_date = "2026-08-31"

[assets]
directory = "./public"
binding = "ASSETS"
# "/archive*" and "/data*" are here so worker.js can refuse them with a 404, blocking direct visitor
# access to raw archive and data JSON files while /api/v1/* serves public data. The files stay in public/
# because the build and the collector write them there, so they are still uploaded as assets.
run_worker_first = ["/", "/api/*", "/archive*", "/data*"]

# Visitor feedback is stored one key per submission in the KV namespace titled
# COLLEGEDASH_FEEDBACK on the NextOneTwoLabs account. The title is prefixed because the bare
# FEEDBACK title already belongs to the sibling project NextOneTwoLabs/nextonetwo-website; the
# title and the binding name are independent, and it is the binding name below that worker.js
# reads as env.FEEDBACK. The id is an identifier, not a credential, so committing it is correct.

# POST /api/ask (issue #165, AI prototype 1) is switched on, for the site owner only. worker.js serves it only while
# this is the string "true" AND the ANTHROPIC_API_KEY secret exists; setting it back to "false" switches ask off.
# The key is a secret, set with `wrangler secret put ANTHROPIC_API_KEY`; it never goes in this file or anywhere in
# the repository. It answers only a request carrying a valid Cloudflare Access token for the Access application
# "college" that protects college.nextonetwo.com/api/ask* (issue #179): ACCESS_TEAM_DOMAIN is the Zero Trust team
# domain ("https://<team>.cloudflareaccess.com", the token's iss) and ACCESS_AUD is that application's Audience
# (AUD) tag. Both are identifiers, not credentials, so they belong here; if either is emptied every ask request is
# refused (403). tests/ask_enabled_config.test.mjs checks these values against the Worker's own config checks.
[vars]
ASK_ENABLED = "true"
ACCESS_TEAM_DOMAIN = "https://broad-snowflake-934e.cloudflareaccess.com"
ACCESS_AUD = "b9c9162446e83350b83b6e6cc4ee0b4d386a1cf55e3fabb6b52f4822a1e5080b"
# Speed measurements (issue #394, api/perf.mjs), the two switches. PERF_SAMPLE is the share of page loads that send
# timing reports to POST /api/perf, a number in (0, 1]; "0" (or anything else) is off: pages send none and every
# report is refused. "1", every page load, is the owner's decision of 2026-09-30 (#394), made on the account's 7-day
# volume (peak about 6.6k requests a day; collegedash about 25 page loads a day). The plan's quota rule still holds:
# 3 x rate x page loads a day at most 2,000, and no reports at all while the account is above 70,000 requests a day. PERF_SERVER "on" writes one timing point
# for a routine "/" or /api/v1 request; anything else writes none. Server-Timing headers are sent either way.
PERF_SAMPLE = "1"
PERF_SERVER = "on"
# Program recommendations, "Find programs for me" (issue #400). "true" adds recs: true to GET /api/status, which is
# the only thing that makes the page draw the entry button, the panel and the form; anything else is off. Off in
# production until the owner's release decision (#400 PR 8). Rolling back is setting it back to "false".
RECS_ENABLED = "false"

[[kv_namespaces]]
binding = "FEEDBACK"
id = "effbba53953e424aa9f528b2a6f00f4e"

# The ask route's $10 monthly budget counter (issue #179): one key per UTC month, "ask-spend:YYYY-MM", holding
# integer micro-dollars. worker.js reads it as env.ASK_BUDGET and refuses every ask request while the binding
# is missing. The namespace is titled COLLEGEDASH_ASK_BUDGET on the NextOneTwoLabs account, created by the owner
# on 2026-09-16. As with FEEDBACK, the id is an identifier, not a credential.
[[kv_namespaces]]
binding = "ASK_BUDGET"
id = "dfdeb314f1b848a287e6f99b453a5d22"

# ---- the /api/v1 session cookie, limits and counts (issue #345 phase 1, api/session.mjs; ported from ECNL #90) ----
# SESSION_SECRET is a Worker secret, never in this file: set it with
#   npx.cmd wrangler versions secret put SESSION_SECRET --name collegedash
# then Retry build (docs/data-api.md, "Owner setup"). Never list it under [secrets] required: a missing required
# secret blocks every deploy, the data refreshes included. Without it sessions are "off": no cookie, RL_IP only.
#
# Counts: at most one data point per non-routine request (the outcome, the route kind, the Sec-Fetch-Site class,
# production or preview; for keys the key id). Never an IP, session id, user agent, key or hash. The dataset is
# created in the dashboard before the first build that binds it (Workers & Pages > Analytics Engine); the owner
# enabled Analytics Engine on 2026-09-25 and #366's build passed with this block.
[[analytics_engine_datasets]]
binding = "API_GATE_STATS"
dataset = "collegedash_api_gate"

# Per-minute limits, measured from this site's own journeys (#345 round-3 section 4; owner decision 3). Counters
# are per Cloudflare location and deliberately approximate: errors favour visitors. A missing binding is treated
# as allowed, which is how the rollback PR (claude/345-rollback-limits) removes RL_SESSION and RL_ANON in one
# deploy. A namespace_id is shared by every Worker on the account that uses it: 3461-3464 are this site's (ECNL
# uses 9001-9004; nextonetwo-website has none). tests/session.test.mjs checks these values.
[[ratelimits]]
name = "RL_SESSION"          # per session id, for requests with a valid session cookie
namespace_id = "3461"
simple = { limit = 180, period = 60 }

[[ratelimits]]
name = "RL_ANON"             # per IP (IPv6 /64): the small allowance for requests with neither a key nor a cookie
namespace_id = "3462"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_IP"               # per IP (IPv6 /64), every request on every door: a ceiling sized for a shared Wi-Fi
namespace_id = "3463"
simple = { limit = 1200, period = 60 }

[[ratelimits]]
name = "RL_KEY"              # per API key id ("key:<id>"), after RL_IP and the key check (#345 phase 2)
namespace_id = "3464"
simple = { limit = 60, period = 60 }

# ---- speed measurements (issue #394, api/perf.mjs; round-2 plan approved on the issue) ----
# RL_PERF: speed reports per session id ("perf:<sid>"), checked after the session cookie is verified. A page sends at
# most 3 per load, so 10 a minute binds only on junk: one session id can add at most 14,400 points a day. A script
# that mints fresh sessions by re-fetching "/" is bounded only by RL_IP, as on every other route.
[[ratelimits]]
name = "RL_PERF"
namespace_id = "3465"
simple = { limit = 10, period = 60 }

# One point per routine "/" or /api/v1 request (the server's own timing) and one per accepted speed report, never
# both on one request and never on a request the gate already counted. Fields: docs/data-api.md, "Speed measurements".
# No IP address, session id, user agent, cookie, URL, query or program slug; a profile's size is never written. The
# owner created the dataset in the dashboard on 2026-09-30, before the first build that binds it.
[[analytics_engine_datasets]]
binding = "PERF_STATS"
dataset = "collegedash_perf"

# ---- API keys (issue #345 phase 2, api/apikey.mjs; ported from ECNL #93) ----
# One record per key in the KV namespace titled COLLEGE_API_KEYS (its own store, never FEEDBACK or ASK_BUDGET):
# "key:<id>" -> {"v":1,"hash":<SHA-256 hex of the whole key>,"label","created","tier","status"}. The key itself is
# never stored. The owner created the namespace in the dashboard (Workers & Pages > KV) on 2026-09-25 and recorded
# its id on #345; the id is an identifier, not a credential. tools/apikey.mjs carries the same id (tests/apikey-tool.test.mjs
# checks they match). With the binding missing or failing, keyed requests fail closed with 503.
[[kv_namespaces]]
binding = "API_KEYS"
id = "66b2f1f49eed4fbc9e7d8bb760f4a79b"
