// Position x class depth chart; redshirt classes fold into their year. Shared by Overview and Roster.
function posClassMatrix(r) {
  const classes = ['FR', 'SO', 'JR', 'SR', 'GR'], positions = ['GK', 'D', 'M', 'F'];
  const cnt = (pos, c) => (r.byPosClass[pos]?.[c] || 0) + (r.byPosClass[pos]?.['R-' + c] || 0);
  return `<table class="matrix"><tr><th></th>${classes.map(c => `<th>${c}</th>`).join('')}<th>Total</th></tr>
    ${positions.map(pos => { const tot = classes.reduce((a, c) => a + cnt(pos, c), 0); return `<tr><th>${pos}</th>${classes.map(c => `<td class="${cnt(pos, c) >= 3 ? 'hot' : ''}">${cnt(pos, c) || ''}</td>`).join('')}<td><b>${tot}</b></td></tr>`; }).join('')}
    <tr><th>Total</th>${classes.map(c => `<td><b>${positions.reduce((a, pos) => a + cnt(pos, c), 0)}</b></td>`).join('')}<td><b>${r.count}</b></td></tr></table>`;
}

    </div>
    <div class="card"><h3>${r.season} roster · ${r.count} players</h3><div class="tscroll"><table>
      <tr><th class="num">#</th><th>Name</th><th>Pos</th><th>Class</th><th>Ht</th><th>Hometown</th><th>High school</th><th>Club</th><th>Major</th></tr>${rows}</table></div>

async function tabCommitments(p) {
  const byYear = {};
  p.commitments.forEach(c => { (byYear[c.gradYear] ||= []).push(c); });
  const years = Object.keys(byYear).sort();
  const statusBadge = s => `<span class="badge ${{ verbal: '', signed: 'good', enrolled: 'good', decommitted: 'crit' }[s]}">${s}</span>`;
  const confBadge = c => c === 'confirmed' ? '<span class="badge good">confirmed</span>' : c === 'single-source' ? '<span class="badge warn">single source</span>' : '<span class="badge">unreviewed</span>';
  const srcChip = s => { const label = { tds: 'TopDrawerSoccer', soccerwire: 'SoccerWire', press_release: 'Press release', instagram: 'Instagram', x: 'X' }[s.kind] || s.kind; return `<span class="chip">${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(label)}</a>` : esc(label)}${s.missingSince ? ` <span class="muted" title="No longer listed since ${esc(s.missingSince)}">⚠</span>` : ''}</span>`; };
  const when = c => c.status === 'enrolled' && !c.announced ? '<span class="muted">on roster</span>' : c.announced ? `<b>${fmtDate(c.announced)}</b><br><span class="muted">${esc((c.announcedSource || '').replace(/_/g, ' '))}</span>` : c.approxDate ? `≈ ${fmtDate(c.approxDate.date)}<br><span class="muted">${esc(c.approxDate.basis)}</span>` : '<span class="muted">date unknown</span>';
  const list = years.map(y => `<div class="card section"><h3>Class of ${y} <span class="muted" style="font-weight:400">· ${byYear[y].length} commit${byYear[y].length === 1 ? '' : 's'}</span></h3>
    ${byYear[y].map(c => `<div class="commit"><div><div class="who">${esc(c.name)} <small>${esc(c.pos || '?')} · ${esc(c.club || 'club unknown')}${c.city ? ` · ${esc(c.city)}` : ''}${c.state ? `, ${esc(c.state)}` : ''}${c.highSchool ? ` · ${esc(c.highSchool)}` : ''}</small></div>
        <div class="row" style="margin-top:4px">${statusBadge(c.status)} ${confBadge(c.confidence)} ${c.flags.map(f => `<span class="badge ${f === 'possibly-decommitted' ? 'crit' : ''}">${esc(f)}</span>`).join(' ')}${c.aliases.length ? `<span class="small muted">also listed as ${esc(c.aliases.join(', '))}</span>` : ''}</div>
        <div class="srcs">${c.sources.map(srcChip).join('')}</div></div>
      <div class="right">${when(c)}</div></div>`).join('')}</div>`).join('');
  // roster need: graduating by position vs next class commits
  const r = p.roster, next = r ? String(r.season + 1) : years[0];
  const need = r ? ['GK', 'D', 'M', 'F'].map(pos => { const g = r.graduatingByPos[pos] || 0; const cm = (byYear[next] || []).filter(c => (c.pos || '').split('/')[0] === pos).length; return `<tr><td class="pos">${pos}</td><td class="num">${g}</td><td class="num">${cm}</td><td class="num ${cm - g < 0 ? 'neg' : ''}">${cm - g > 0 ? '+' : ''}${cm - g}</td></tr>`; }).join('') : '';
  return `<div class="grid g2 section">
      ${r ? `<div class="card"><h3>Roster need · seniors leaving after ${r?.season ?? ''} vs class of ${next ?? '—'}</h3>${r ? `<table class="need"><tr><th>Pos</th><th class="num">Graduating (SR/GR)</th><th class="num">Commits ${next ?? ''}</th><th class="num">Net</th></tr>${need}</table><p class="small muted" style="margin-top:6px">A rough read of where the next class fills holes. Transfers, early departures and redshirts are not modeled.</p>` : '<div class="empty">Roster not collected.</div>'}</div>` : ''}
      <div class="card"><h3>How to read this</h3><p class="small ink2"><b>confirmed</b> = listed by two independent sources, an official release, or already on the roster. <b>single source</b> = one recruiting site only. Dates marked ≈ are approximations (when a SoccerWire profile was created, or when this tool first saw the record), not announcement dates; approving a dated social post in the Review queue sets the real date. ⚠ on a source means the recruit dropped off that site's list — a possible decommit.</p>
        ${p.curated?.recruitingNotes ? `<h4 style="margin-top:8px">My recruiting notes</h4><p class="prose">${esc(p.curated.recruitingNotes)}</p>` : ''}</div>
    </div>
    ${list || '<div class="card empty">No commitments collected yet.</div>'}
    ${prov([{ source: 'TopDrawerSoccer team page', url: p.links.tds ? p.links.tds + '/tab-commitments' : null, asOf: null }, { source: 'SoccerWire player directory', url: 'https://www.soccerwire.com/soccer-player-directory/', asOf: null }])}`;
}

async function tabSchedule(p) {
  const s = p.schedule;
  if (!s) return '<div class="card empty">Schedule not collected yet.</div>';
  const today = todayLocal();
  // unscored cell: future dates are upcoming; history and exhibitions were never recorded; a past date is a result we have not collected yet
  const unscored = (g, isHist) => !g.date ? '—' : g.date >= today ? 'upcoming' : (isHist || g.exhibition) ? 'not recorded' : 'result pending';
  const row = (g, isHist) => `<tr><td>${fmtDate(g.date)}</td><td>${g.homeAway === 'H' ? 'vs' : g.homeAway === 'A' ? 'at' : 'vs (N)'} ${g.opponentRank ? `<span class="muted">#${g.opponentRank}</span> ` : ''}<b>${esc(g.opponent)}</b>${g.conferenceGame ? ' <span class="badge">conf</span>' : ''}${g.exhibition ? ' <span class="badge">exhibition</span>' : ''}</td><td class="small">${esc(g.location || '')}</td>
    <td>${g.result ? `<b class="${g.result === 'W' ? 'good-text' : ''}" style="color:${g.result === 'W' ? 'var(--good-text)' : g.result === 'L' ? 'var(--critical)' : 'inherit'}">${g.result}</b> ${esc(g.score || '')}` : `<span class="muted">${unscored(g, isHist)}</span>`}</td>
    <td class="small">${Object.entries(g.links || {}).map(([k, v]) => `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(k)}</a>`).join(' · ')}</td></tr>`;
  const hist = Object.entries(s.history || {}).sort((a, b) => b[0] - a[0]);

async function tabCamps(p) {
  // p.camps: { url, hubUrl, finalUrl, host, vendor, discoveredVia, robotsBlocked, fetchError, items[], _meta[] }
  // items carry kind (camp | news | curated), startDate/endDate (YYYY-MM-DD, or YYYY-MM when precision is
  // 'month'), dateText, confidence ('heuristic' = read automatically from page text). upcoming/past is
  // decided here with today's local date: the site is static and rebuilt once a day.
  const c = p.camps;
  // campHttpUrl / campLink / campWhen / campBadges live at module scope (see "camps, shared") so this
  // tab and the site-wide #/camps view render a camp the same way. They were local to this function
  // until issue #65 gave them a second caller; the lift was a move, not a rewrite.
  const httpUrl = campHttpUrl, link = campLink, when = campWhen, badges = campBadges;
  const skipped = (p._build.skipped || []).find(s => s.collector === 'camps');
  const failedCamps = (p._build.failed || []).find(s => s.collector === 'camps');
  if (!c) return skipped
    ? `<div class="card empty">Camp information is not collected for this program: ${esc(skipped.reason.replace(/^camps: /, '').replace(/ \(registry [^)]*\)$/, ''))}. Check the ${extLink(p.links.athletics, 'athletics site')} directly.</div>`
    : failedCamps ? `<div class="card empty">The athletics site could not be read for camp information on the last check. Check the ${extLink(p.links.athletics, 'athletics site')} directly.</div>`
    : '<div class="card empty">Camp info not collected yet.</div>';
  const today = todayLocal(), month = today.slice(0, 7);
  const asOf = c._meta?.[0]?.asOf;
  const checked = asOf ? ` (checked ${fmtDate(asOf)})` : '';
  const isPast = it => it.precision === 'month' ? it.startDate < month : (it.endDate || it.startDate) < today;
  const dated = c.items.filter(it => it.startDate), undated = c.items.filter(it => !it.startDate);
  const upcoming = dated.filter(it => !isPast(it)), past = dated.filter(isPast).slice().reverse();
  const row = (it, old) => `<tr><td>${it.startDate ? when(it) : `<span class="muted">${esc(it.dateText || 'date not given')}</span>`}</td>
    <td><b>${esc(it.name)}</b> ${badges(it, old)}${it.kind === 'news' && it.newsTitle && it.newsTitle !== it.name ? `<div class="small muted">${esc(it.newsTitle)}</div>` : ''}</td>
    <td class="small">${esc([it.location, it.ages, it.price].filter(Boolean).join(' · '))}</td>
    <td class="small">${[it.registerUrl ? link(it.registerUrl, 'register') : '', it.sourceUrl ? link(it.sourceUrl, 'source') : ''].filter(Boolean).join(' · ')}</td></tr>`;
  const table = (rows, old) => `<div class="tscroll"><table><tr><th>When</th><th>Camp</th><th>Details</th><th>Links</th></tr>${rows.map(it => row(it, old)).join('')}</table></div>`;
  const shown = c.finalUrl || c.url;
  const unreadable = c.parsed === false && c.url && !c.robotsBlocked && !c.fetchError;  // a PDF, an empty body, non-HTML
  const linkCard = c.url
    ? `<div class="card"><h3>Camp information</h3><p>${httpUrl(shown) ? extLink(shown, `Camp page on ${c.host || shown}`) : `<span class="muted">Camp page on ${esc(c.host || shown)}</span>`}${c.discoveredVia === 'registry' ? '' : ' <span class="muted small">(auto-detected from the athletics site navigation)</span>'}${c.hubUrl ? `<br><span class="small muted">via the all-sports camps page: ${link(c.hubUrl, c.hubUrl)}</span>` : ''}</p>
        ${c.robotsBlocked ? '<p class="small muted">This site asks automated readers not to open it (robots.txt), so only the link is shown here; open it to see dates.</p>' : ''}
        ${c.fetchError ? '<p class="small muted">The camp page could not be read on the last check; open it directly.</p>' : ''}
        ${unreadable ? '<p class="small muted">The camp page could not be read automatically; open it for dates.</p>' : ''}</div>`
    : `<div class="card empty">We could not find a camp page on the athletics site${checked}. Camps are usually announced in spring; try the ${extLink(p.links.athletics, 'athletics site')} directly.</div>`;
  const list = upcoming.length ? `<div class="card section"><h3>Upcoming camps</h3>${table(upcoming, false)}</div>`
    : (c.url && !c.robotsBlocked && !c.fetchError && !unreadable) ? `<div class="card empty">No upcoming ID camps listed on the camp page${checked}. Open the camp page for the latest dates.</div>` : '';
  const pastHtml = past.length ? `<details class="card section" style="padding:12px 16px"><summary style="font-size:14px;color:var(--ink)"><b>Past camps</b> · ${past.length}</summary><div style="margin-top:8px">${table(past, true)}</div></details>` : '';
  const undatedHtml = undated.length ? `<div class="card section"><h3>Announced without a date</h3>${table(undated, false)}</div>` : '';
  return `${linkCard}${list}${pastHtml}${undatedHtml}${prov(c._meta, 'Camp entries are read automatically from the camp page and news releases; confirm dates and prices with the school before registering.')}`;
}

const US_STATES = 'AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY'.split(' ');
// A Compare cell for a measure that does not apply to the program's division (#198): said, not dashed.
const notApplicableCell = p => `<span class="muted small">not applicable to ${esc(divisionName(p.division))}</span>`;
/* Cost of attendance for the residency picked on Compare (#201). school.costOfAttendance is College Scorecard's
   COSTT4_A, one figure, which for a public school is built on IN-STATE tuition and fees. Shown as-is to an
   out-of-state family it can sit below out-of-state tuition alone (140 of 421 publics at the time of #201). So for a
   public school the out-of-state figure is derived: published cost - in-state tuition + out-of-state tuition, and
   labelled as an estimate. Private schools publish one tuition, so their figure is unchanged. No figure is shown
   that is below the tuition it includes; where the parts to derive it are missing, '—' with the reason.
   Returns { inS, outS } for "(not set)" (both shown, like the Tuition row), or { value, basis } for a set state. */
function coaFor(s, home) {
  s = s || {};
  const coa = s.costOfAttendance, inT = s.tuitionInState, outT = s.tuitionOutOfState;
  if (coa == null) return { value: null, basis: null };
  if (s.ownership !== 'Public') return { value: coa, basis: null };
  const okIn = inT == null || coa >= inT ? coa : null; // the published figure never below the in-state tuition it includes
  const est = okIn != null && inT != null && outT != null ? coa - inT + outT : null;
  if (!home) return { inS: okIn, outS: est };
  return home === s.state ? { value: okIn, basis: 'in-state' } : { value: est, basis: 'out-of-state' };
}
const COA_SRC = 'College Scorecard cost of attendance (COSTT4_A), published on an in-state tuition basis for public schools';
const COA_EST = 'Estimate: Scorecard cost of attendance minus in-state tuition plus out-of-state tuition. Scorecard publishes no out-of-state cost of attendance.';
function coaCell(s, home) {
  const r = coaFor(s, home);
  if ('inS' in r) return r.inS == null && r.outS == null ? '—'
    : `<span title="${esc(COA_SRC)}">${fmtUsd(r.inS)} in</span> / <span title="${esc(COA_EST)}">${r.outS == null ? '—' : fmtUsd(r.outS)} out <span class="muted small">(est.)</span></span>`;
  if (r.value == null) return r.basis === 'out-of-state' && s?.costOfAttendance != null
    ? `— <span class="muted small">out-of-state figure not available</span>` : '—';
  if (!r.basis) return fmtUsd(r.value);
  return r.basis === 'in-state'
    ? `<b>${fmtUsd(r.value)}</b> <span class="muted" title="${esc(COA_SRC)}">in-state</span>`
    : `<b>${fmtUsd(r.value)}</b> <span class="muted" title="${esc(COA_EST)}">out-of-state, est.</span>`;
}

/* ---------- feedback ---------- */
/* The panel lives in the footer, outside #app, so it survives every re-render. It posts JSON to
   the Worker (worker.js); the mailto: address stays as the fallback, shown only when the post
   fails, with whatever the visitor typed still in the box. */
(() => {
  const panel = $('#feedback'), form = $('#feedbackForm'), note = $('#feedbackNote');
  if (!panel || !form || !note) return;
  /* Not every failure comes from the Worker — a proxy or the local server answers in its own
     words — so end the sentence before the fallback rather than assuming it was punctuated. */
  const fail = msg => { note.innerHTML = esc(/[.!?]$/.test(msg) ? msg : msg + '.') + ` Or email ${feedbackLink('us directly')}.`; };
  /* Send is type="button", not a submit control: if anything earlier in this script throws and the
     handler below is never attached, a native submit would reload the page and throw away what the
     visitor typed. requestSubmit() runs the same required/email validation a submit click would. */
  form.querySelector('button').addEventListener('click', () => form.requestSubmit());
  /* With no submit control the browser no longer submits on Enter in the email field, so keep it. */
  form.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); form.requestSubmit(); } });
  panel.addEventListener('keydown', e => { if (e.key === 'Escape' && panel.open) { panel.open = false; panel.querySelector('summary').focus(); } });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = form.querySelector('button');
    btn.disabled = true;
    note.classList.remove('ok');
    note.textContent = 'Sending…';
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    try {
      const res = await fetch('/api/feedback', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          message: form.elements.message.value,
          email: form.elements.email.value,
          website: form.elements.website.value,
          route: location.hash,
          program: parts[0] === 'p' ? (parts[1] || '') : '',
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        form.hidden = true;
        note.classList.add('ok');
        note.textContent = 'Thanks — got it.';
        note.tabIndex = -1;
        note.focus({ preventScroll: true });
      } else {
        fail(data.error || 'Something went wrong. Please try again.');
      }
    } catch {
      fail('Couldn’t reach the server. Please try again.');
    }
    btn.disabled = false;
  });
})();

/* ---------- boot ---------- */
loadIndex().then(() => { renderObserved(); renderSidebar(); route(); }).catch(e => { $('#app').innerHTML = `<div class="content-body"><div class="card"><h2>The data could not be loaded</h2><p class="muted">${esc(e.message)}. Please try again in a few minutes.</p></div></div>`; });
</script>
</body>
</html>
